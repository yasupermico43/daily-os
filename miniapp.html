<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Daily OS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c26;
    --border: rgba(255,255,255,0.07);
    --accent: #7c6ff7;
    --accent2: #4ecdc4;
    --accent3: #ff6b6b;
    --amber: #ffd166;
    --text: #f0f0f8;
    --muted: rgba(240,240,248,0.45);
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }
  
  /* Noise overlay */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
  }

  #app { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  .header {
    padding: 16px 20px 12px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .header-left { display: flex; flex-direction: column; }
  .header-greeting { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .header-title { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .header-title span { color: var(--accent); }
  .date-badge {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 6px 12px;
    font-size: 12px; color: var(--muted);
  }

  /* Progress ring */
  .progress-bar {
    margin: 0 20px 0;
    padding: 14px 0 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .progress-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .progress-label-text { font-size: 12px; color: var(--muted); }
  .progress-label-pct { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; color: var(--accent2); }
  .progress-track { height: 4px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 4px; transition: width .4s ease; }

  /* Nav */
  .nav {
    display: flex; gap: 4px; padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0; overflow-x: auto; scrollbar-width: none;
  }
  .nav::-webkit-scrollbar { display: none; }
  .nav-btn {
    flex-shrink: 0; padding: 7px 14px; border-radius: 20px;
    font-size: 12px; font-weight: 500; font-family: 'DM Sans', sans-serif;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); cursor: pointer; transition: all .2s;
  }
  .nav-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Content */
  .content { flex: 1; overflow-y: auto; padding: 16px 20px 100px; scrollbar-width: none; }
  .content::-webkit-scrollbar { display: none; }

  /* Section */
  .section-title {
    font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
    margin: 20px 0 10px;
  }
  .section-title:first-child { margin-top: 0; }

  /* Habit card */
  .habit-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
    margin-bottom: 8px; display: flex; align-items: center; gap: 14px;
    transition: all .2s; cursor: pointer; user-select: none;
  }
  .habit-card:active { transform: scale(0.98); }
  .habit-card.done { border-color: rgba(78,205,196,0.25); background: rgba(78,205,196,0.06); }
  .habit-icon {
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .habit-info { flex: 1; min-width: 0; }
  .habit-name { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
  .habit-card.done .habit-name { color: var(--muted); text-decoration: line-through; }
  .habit-time { font-size: 11px; color: var(--muted); }
  .habit-check {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--border); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .habit-card.done .habit-check { background: var(--accent2); border-color: var(--accent2); }
  .checkmark { display: none; color: #fff; font-size: 13px; font-weight: 700; }
  .habit-card.done .checkmark { display: block; }

  /* Calorie tracker */
  .calorie-widget {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px;
    margin-bottom: 8px;
  }
  .calorie-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .calorie-total { font-family: 'Syne', sans-serif; font-size: 36px; font-weight: 800; line-height: 1; }
  .calorie-total span { font-size: 14px; font-weight: 400; color: var(--muted); font-family: 'DM Sans', sans-serif; }
  .calorie-goal { font-size: 12px; color: var(--muted); text-align: right; }
  .calorie-goal strong { color: var(--amber); display: block; font-size: 16px; font-family: 'Syne', sans-serif; }
  .calorie-track { height: 6px; background: var(--surface2); border-radius: 6px; overflow: hidden; margin-bottom: 16px; }
  .calorie-fill { height: 100%; border-radius: 6px; transition: width .4s ease; background: var(--amber); }
  .calorie-fill.over { background: var(--accent3); }
  .macro-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .macro-item { flex: 1; background: var(--surface2); border-radius: var(--radius-sm); padding: 10px; text-align: center; }
  .macro-val { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; }
  .macro-label { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .meal-input-row { display: flex; gap: 8px; }
  .meal-input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 14px;
    color: var(--text); font-size: 14px; font-family: 'DM Sans', sans-serif;
    outline: none;
  }
  .meal-input::placeholder { color: var(--muted); }
  .meal-input:focus { border-color: var(--accent); }
  .add-btn {
    background: var(--accent); border: none; border-radius: var(--radius-sm);
    padding: 10px 16px; color: #fff; font-size: 13px; font-weight: 500;
    font-family: 'DM Sans', sans-serif; cursor: pointer; transition: opacity .2s;
    white-space: nowrap;
  }
  .add-btn:active { opacity: 0.8; }
  .meals-list { margin-top: 12px; }
  .meal-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .meal-item:last-child { border-bottom: none; }
  .meal-name { color: var(--text); }
  .meal-kcal { color: var(--amber); font-weight: 500; }
  .meal-del { color: var(--muted); cursor: pointer; padding: 0 4px; font-size: 16px; }

  /* AI Tasks */
  .ai-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 8px;
  }
  .ai-level-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .ai-level-badge {
    background: rgba(124,111,247,0.15); border: 1px solid rgba(124,111,247,0.3);
    border-radius: 20px; padding: 4px 12px; font-size: 11px; color: var(--accent);
    font-weight: 500;
  }
  .ai-xp { font-size: 12px; color: var(--muted); }
  .ai-task-title { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .ai-task-desc { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 16px; }
  .ai-task-tips { background: var(--surface2); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 16px; }
  .ai-task-tips-title { font-size: 11px; color: var(--accent); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  .ai-task-tip { font-size: 12px; color: var(--muted); padding: 3px 0; }
  .ai-task-tip::before { content: '→ '; color: var(--accent2); }
  .complete-task-btn {
    width: 100%; padding: 14px; border-radius: var(--radius-sm);
    background: var(--accent); border: none; color: #fff;
    font-size: 14px; font-weight: 600; font-family: 'Syne', sans-serif;
    cursor: pointer; transition: opacity .2s; letter-spacing: .02em;
  }
  .complete-task-btn:active { opacity: 0.8; }
  .complete-task-btn.done-btn { background: var(--surface2); color: var(--muted); }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
  }
  .stat-val { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
  .stat-label { font-size: 11px; color: var(--muted); }
  .streak-card {
    background: var(--surface); border: 1px solid rgba(255,107,107,0.2);
    border-radius: var(--radius); padding: 16px;
    display: flex; align-items: center; gap: 16px; margin-bottom: 8px;
  }
  .streak-flame { font-size: 36px; }
  .streak-val { font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800; color: var(--accent3); }
  .streak-label { font-size: 12px; color: var(--muted); }
  .week-row { display: flex; gap: 6px; margin-top: 4px; }
  .week-day {
    flex: 1; aspect-ratio: 1; border-radius: 8px;
    background: var(--surface2); display: flex; align-items: center;
    justify-content: center; font-size: 10px; color: var(--muted);
    font-weight: 500; flex-direction: column; gap: 2px;
  }
  .week-day.done { background: rgba(78,205,196,0.15); color: var(--accent2); }
  .week-day.today { border: 1px solid var(--accent); }
  .week-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  /* Bottom tab bar */
  .tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(10,10,15,0.95); border-top: 1px solid var(--border);
    display: flex; padding: 8px 0 max(8px, env(safe-area-inset-bottom));
    z-index: 100; backdrop-filter: blur(20px);
  }
  .tab-item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 4px; cursor: pointer; padding: 4px 0;
    transition: all .2s; color: var(--muted);
  }
  .tab-item.active { color: var(--accent); }
  .tab-icon { font-size: 22px; line-height: 1; }
  .tab-label { font-size: 10px; font-weight: 500; }

  /* Toast */
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 10px 20px; font-size: 13px;
    opacity: 0; transition: all .3s; pointer-events: none; white-space: nowrap; z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Motivational quote */
  .quote-card {
    background: linear-gradient(135deg, rgba(124,111,247,0.1), rgba(78,205,196,0.08));
    border: 1px solid rgba(124,111,247,0.2);
    border-radius: var(--radius); padding: 16px 20px; margin-bottom: 8px;
  }
  .quote-text { font-size: 14px; line-height: 1.6; color: var(--text); font-style: italic; margin-bottom: 6px; }
  .quote-author { font-size: 11px; color: var(--accent); font-weight: 500; }

  /* Journal */
  .journal-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 8px;
  }
  .journal-textarea {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px; color: var(--text);
    font-size: 14px; font-family: 'DM Sans', sans-serif; line-height: 1.6;
    resize: none; outline: none; min-height: 100px;
  }
  .journal-textarea:focus { border-color: var(--accent); }
  .journal-prompt { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .save-btn {
    width: 100%; padding: 12px; border-radius: var(--radius-sm);
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-size: 13px; font-weight: 500;
    font-family: 'DM Sans', sans-serif; cursor: pointer; margin-top: 10px;
    transition: all .2s;
  }
  .save-btn:active { background: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-left">
      <span class="header-greeting">твой день</span>
      <div class="header-title">Daily <span>OS</span></div>
    </div>
    <div class="date-badge" id="dateBadge"></div>
  </div>

  <div class="progress-bar">
    <div class="progress-label">
      <span class="progress-label-text">прогресс дня</span>
      <span class="progress-label-pct" id="progressPct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <div class="nav" id="navBar">
    <button class="nav-btn active" onclick="showTab('habits')">Привычки</button>
    <button class="nav-btn" onclick="showTab('calories')">Питание</button>
    <button class="nav-btn" onclick="showTab('ai')">AI обучение</button>
    <button class="nav-btn" onclick="showTab('journal')">Дневник</button>
    <button class="nav-btn" onclick="showTab('stats')">Статистика</button>
  </div>

  <div class="content" id="content"></div>

  <div class="tab-bar">
    <div class="tab-item active" onclick="showTab('habits')">
      <span class="tab-icon">✅</span>
      <span class="tab-label">День</span>
    </div>
    <div class="tab-item" onclick="showTab('calories')">
      <span class="tab-icon">🥗</span>
      <span class="tab-label">Питание</span>
    </div>
    <div class="tab-item" onclick="showTab('ai')">
      <span class="tab-icon">🤖</span>
      <span class="tab-label">AI</span>
    </div>
    <div class="tab-item" onclick="showTab('journal')">
      <span class="tab-icon">📓</span>
      <span class="tab-label">Дневник</span>
    </div>
    <div class="tab-item" onclick="showTab('stats')">
      <span class="tab-icon">📊</span>
      <span class="tab-label">Статы</span>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ─── DATA ───────────────────────────────────────────────────────────────────
const HABITS = [
  { id:'wake',    icon:'🌅', name:'Подъём без телефона',    time:'5:30',  group:'Утро' },
  { id:'water',   icon:'🍋', name:'Вода с лимоном + солнце',time:'5:32',  group:'Утро' },
  { id:'meditate',icon:'🧘', name:'Медитация 15 мин',        time:'5:45',  group:'Утро' },
  { id:'affirm',  icon:'💫', name:'Аффирмации + визуализация',time:'6:00', group:'Утро' },
  { id:'stoic',   icon:'⚡', name:'Стоицизм — вопрос дня',   time:'6:10',  group:'Утро' },
  { id:'shower',  icon:'🚿', name:'Холодный душ',             time:'6:15',  group:'Утро' },
  { id:'workout', icon:'💪', name:'Зарядка 30 мин',           time:'6:25',  group:'Спорт' },
  { id:'gym',     icon:'🏋️', name:'Зал (через день)',         time:'18:00', group:'Спорт' },
  { id:'breakfast',icon:'🍳',name:'Завтрак',                  time:'7:00',  group:'Питание' },
  { id:'plan',    icon:'🎯', name:'Планирование — 3 задачи',  time:'7:20',  group:'Работа' },
  { id:'ailearn', icon:'🤖', name:'Обучение AI (блок 1)',     time:'7:30',  group:'Работа' },
  { id:'read',    icon:'📚', name:'Чтение 20–30 страниц',     time:'12:30', group:'Развитие' },
  { id:'work',    icon:'💼', name:'Проекты + клиенты',        time:'13:00', group:'Работа' },
  { id:'walk',    icon:'🚶', name:'Прогулка после обеда',     time:'12:20', group:'Спорт' },
  { id:'dinner',  icon:'🥗', name:'Ужин (правильный)',        time:'19:30', group:'Питание' },
  { id:'aicontent',icon:'📱',name:'AI контент / подкаст',    time:'20:00', group:'Развитие' },
  { id:'diary',   icon:'📓', name:'Журнал / дневник',         time:'20:45', group:'Вечер' },
  { id:'tomorrow',icon:'📋', name:'Подготовка к завтра',      time:'21:00', group:'Вечер' },
  { id:'detox',   icon:'🌙', name:'Цифровой детокс',          time:'21:10', group:'Вечер' },
];

const AI_TASKS = [
  { level:1, title:'Что такое промпт-инжиниринг', desc:'Изучи основы написания промптов. Узнай разницу между плохим и хорошим промптом.', tips:['Открой Claude или ChatGPT','Попробуй написать один и тот же запрос 3 разными способами','Сравни результаты и запиши что работает лучше'] },
  { level:1, title:'Создай своего первого AI-ассистента', desc:'Используй системный промпт чтобы задать роль и поведение AI. Это основа любого агента.', tips:['Зайди в Claude.ai','В настройках задай системный промпт: "Ты эксперт по..."','Протестируй 5 разных запросов'] },
  { level:2, title:'Разберись с API Anthropic', desc:'Научись делать запросы к Claude через API. Это откроет возможность создавать настоящих агентов.', tips:['Зарегистрируйся на console.anthropic.com','Получи API ключ','Сделай первый запрос через curl или Python'] },
  { level:2, title:'Автоматизация с Make.com', desc:'Создай первый автоматизированный воркфлоу который использует AI без написания кода.', tips:['Зарегистрируйся на Make.com (бесплатно)','Создай сценарий: триггер → Claude → действие','Пример: получить email → обработать AI → ответить'] },
  { level:3, title:'Построй AI агента для задачи', desc:'Создай агента который выполняет реальную задачу автономно — анализ, поиск, создание контента.', tips:['Выбери конкретную задачу бизнеса','Опиши шаги которые должен делать агент','Используй n8n или Make для оркестрации'] },
  { level:3, title:'Найди первого клиента на AI', desc:'Используй маркетинговые знания. Найди бизнес с болью которую решает AI автоматизация.', tips:['Составь список из 10 местных бизнесов','Найди повторяющуюся задачу которую они делают вручную','Предложи автоматизировать бесплатно за кейс'] },
];

const QUOTES = [
  { text: 'Дисциплина — это выбор между тем чего хочешь сейчас и тем чего хочешь больше всего.', author: 'Авраам Линкольн' },
  { text: 'Успех — это сумма небольших усилий, повторяемых день за днём.', author: 'Роберт Кольер' },
  { text: 'Не жди подходящего момента. Возьми момент и сделай его подходящим.', author: 'Дж. Б. Пристли' },
  { text: 'Твои привычки сегодня — это твоя жизнь завтра.', author: '' },
  { text: 'Каждый эксперт был когда-то новичком. Начни.', author: '' },
];

// ─── STATE ──────────────────────────────────────────────────────────────────
const todayKey = () => new Date().toISOString().slice(0,10);
const load = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } };
const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));

let state = {
  tab: 'habits',
  done: load('done_' + todayKey(), {}),
  meals: load('meals_' + todayKey(), []),
  aiProgress: load('ai_progress', 0),
  aiDone: load('ai_done_' + todayKey(), false),
  journal: load('journal_' + todayKey(), { gratitude:'', lesson:'', tomorrow:'' }),
  streak: load('streak_data', { count:0, lastDate:'' }),
};

// Update streak
function updateStreak() {
  const today = todayKey();
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  if (state.streak.lastDate === today) return;
  if (state.streak.lastDate === yesterday) state.streak.count++;
  else if (state.streak.lastDate !== today) state.streak.count = 1;
  state.streak.lastDate = today;
  save('streak_data', state.streak);
}

// ─── PROGRESS ───────────────────────────────────────────────────────────────
function getProgress() {
  const total = HABITS.length;
  const done = Object.values(state.done).filter(Boolean).length;
  return Math.round(done / total * 100);
}

function refreshProgress() {
  const pct = getProgress();
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

// ─── CALORIES ───────────────────────────────────────────────────────────────
const CALORIE_GOAL = 2200;
function totalCals() { return state.meals.reduce((s,m) => s + m.kcal, 0); }

// ─── TABS ────────────────────────────────────────────────────────────────────
function showTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.nav-btn').forEach((b,i) => {
    const tabs = ['habits','calories','ai','journal','stats'];
    b.classList.toggle('active', tabs[i] === tab);
  });
  document.querySelectorAll('.tab-item').forEach((b,i) => {
    const tabs = ['habits','calories','ai','journal','stats'];
    b.classList.toggle('active', tabs[i] === tab);
  });
  render();
}

// ─── TOAST ──────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ─── RENDER ─────────────────────────────────────────────────────────────────
function render() {
  const c = document.getElementById('content');
  if (state.tab === 'habits') c.innerHTML = renderHabits();
  else if (state.tab === 'calories') c.innerHTML = renderCalories();
  else if (state.tab === 'ai') c.innerHTML = renderAI();
  else if (state.tab === 'journal') c.innerHTML = renderJournal();
  else if (state.tab === 'stats') c.innerHTML = renderStats();
  refreshProgress();
  bindEvents();
}

function renderHabits() {
  const quote = QUOTES[new Date().getDay() % QUOTES.length];
  const groups = {};
  HABITS.forEach(h => {
    if (!groups[h.group]) groups[h.group] = [];
    groups[h.group].push(h);
  });
  let html = `<div class="quote-card"><div class="quote-text">"${quote.text}"</div>${quote.author ? `<div class="quote-author">— ${quote.author}</div>` : ''}</div>`;
  Object.entries(groups).forEach(([g, habits]) => {
    html += `<div class="section-title">${g}</div>`;
    habits.forEach(h => {
      const done = !!state.done[h.id];
      html += `<div class="habit-card ${done?'done':''}" onclick="toggleHabit('${h.id}')">
        <div class="habit-icon">${h.icon}</div>
        <div class="habit-info">
          <div class="habit-name">${h.name}</div>
          <div class="habit-time">${h.time}</div>
        </div>
        <div class="habit-check"><span class="checkmark">✓</span></div>
      </div>`;
    });
  });
  return html;
}

function renderCalories() {
  const total = totalCals();
  const pct = Math.min(100, Math.round(total / CALORIE_GOAL * 100));
  const over = total > CALORIE_GOAL;
  const protein = state.meals.reduce((s,m) => s + (m.protein||0), 0);
  const carbs = state.meals.reduce((s,m) => s + (m.carbs||0), 0);
  const fat = state.meals.reduce((s,m) => s + (m.fat||0), 0);

  let mealsHtml = state.meals.length === 0
    ? '<div style="font-size:13px;color:var(--muted);text-align:center;padding:12px 0">Добавь первый приём пищи</div>'
    : state.meals.map((m,i) => `<div class="meal-item">
        <span class="meal-name">${m.name}</span>
        <span style="display:flex;align-items:center;gap:10px">
          <span class="meal-kcal">${m.kcal} ккал</span>
          <span class="meal-del" onclick="deleteMeal(${i})">×</span>
        </span>
      </div>`).join('');

  return `<div class="calorie-widget">
    <div class="calorie-header">
      <div>
        <div class="calorie-total">${total} <span>ккал</span></div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">${over ? '⚠️ превышение' : `осталось ${CALORIE_GOAL - total} ккал`}</div>
      </div>
      <div class="calorie-goal"><strong>${CALORIE_GOAL}</strong>цель</div>
    </div>
    <div class="calorie-track"><div class="calorie-fill ${over?'over':''}" style="width:${pct}%"></div></div>
    <div class="macro-row">
      <div class="macro-item"><div class="macro-val" style="color:#ff6b6b">${protein}г</div><div class="macro-label">Белок</div></div>
      <div class="macro-item"><div class="macro-val" style="color:#ffd166">${carbs}г</div><div class="macro-label">Углеводы</div></div>
      <div class="macro-item"><div class="macro-val" style="color:#4ecdc4">${fat}г</div><div class="macro-label">Жиры</div></div>
    </div>
    <div class="meal-input-row">
      <input class="meal-input" id="mealName" placeholder="Что съел? (напр. Яйца 2шт)" />
      <input class="meal-input" id="mealKcal" type="number" placeholder="ккал" style="width:80px;flex:none" />
      <button class="add-btn" onclick="addMeal()">+</button>
    </div>
    <div class="meals-list">${mealsHtml}</div>
  </div>
  <div class="section-title">Рекомендации на день</div>
  <div class="habit-card" style="cursor:default">
    <div class="habit-icon">🍳</div>
    <div class="habit-info"><div class="habit-name">Завтрак</div><div class="habit-time">Яйца + овсянка + орехи — 500–600 ккал</div></div>
  </div>
  <div class="habit-card" style="cursor:default">
    <div class="habit-icon">🍗</div>
    <div class="habit-info"><div class="habit-name">Обед</div><div class="habit-time">Курица + рис + овощи — 600–700 ккал</div></div>
  </div>
  <div class="habit-card" style="cursor:default">
    <div class="habit-icon">🥗</div>
    <div class="habit-info"><div class="habit-name">Ужин</div><div class="habit-time">Рыба + салат + авокадо — 400–500 ккал</div></div>
  </div>
  <div class="habit-card" style="cursor:default">
    <div class="habit-icon">🥜</div>
    <div class="habit-info"><div class="habit-name">Перекусы</div><div class="habit-time">Орехи, творог, протеин — 300–400 ккал</div></div>
  </div>`;
}

function renderAI() {
  const idx = Math.min(state.aiProgress, AI_TASKS.length - 1);
  const task = AI_TASKS[idx];
  const done = state.aiDone;
  const levelColors = ['#4ecdc4','#7c6ff7','#ff6b6b'];
  const lc = levelColors[task.level - 1];

  let html = `<div class="ai-card">
    <div class="ai-level-row">
      <span class="ai-level-badge">Уровень ${task.level}/3</span>
      <span class="ai-xp">Задание ${idx+1} из ${AI_TASKS.length}</span>
    </div>
    <div class="ai-task-title">${task.title}</div>
    <div class="ai-task-desc">${task.desc}</div>
    <div class="ai-task-tips">
      <div class="ai-task-tips-title">Как выполнить</div>
      ${task.tips.map(t => `<div class="ai-task-tip">${t}</div>`).join('')}
    </div>
    <button class="complete-task-btn ${done?'done-btn':''}" onclick="completeAITask()">
      ${done ? '✓ Выполнено сегодня' : 'Отметить выполнение'}
    </button>
  </div>`;

  if (state.aiProgress > 0) {
    html += `<div class="section-title">Прогресс обучения</div>`;
    html += `<div class="habit-card" style="cursor:default">
      <div class="habit-icon">🏆</div>
      <div class="habit-info">
        <div class="habit-name">Пройдено заданий: ${state.aiProgress}</div>
        <div class="habit-time">Следующий уровень через ${Math.max(0, 3-state.aiProgress)} задания</div>
      </div>
    </div>`;
  }

  html += `<div class="section-title">Ресурсы для обучения</div>
  <div class="habit-card" style="cursor:default"><div class="habit-icon">📖</div><div class="habit-info"><div class="habit-name">Prompt Engineering Guide</div><div class="habit-time">learn.deeplearning.ai — бесплатно</div></div></div>
  <div class="habit-card" style="cursor:default"><div class="habit-icon">🛠</div><div class="habit-info"><div class="habit-name">n8n — автоматизация</div><div class="habit-time">n8n.io — open source, бесплатно</div></div></div>
  <div class="habit-card" style="cursor:default"><div class="habit-icon">🤖</div><div class="habit-info"><div class="habit-name">Anthropic API Docs</div><div class="habit-time">docs.anthropic.com</div></div></div>`;

  return html;
}

function renderJournal() {
  const j = state.journal;
  return `<div class="section-title">Вечерняя рефлексия</div>
  <div class="journal-card">
    <div class="journal-prompt">3 вещи за которые я благодарен сегодня</div>
    <textarea class="journal-textarea" id="j_gratitude" placeholder="1. ...&#10;2. ...&#10;3. ...">${j.gratitude}</textarea>
  </div>
  <div class="journal-card">
    <div class="journal-prompt">Главный урок дня</div>
    <textarea class="journal-textarea" id="j_lesson" placeholder="Сегодня я понял что...">${j.lesson}</textarea>
  </div>
  <div class="journal-card">
    <div class="journal-prompt">3 главные задачи на завтра</div>
    <textarea class="journal-textarea" id="j_tomorrow" placeholder="1. ...&#10;2. ...&#10;3. ...">${j.tomorrow}</textarea>
  </div>
  <button class="save-btn" onclick="saveJournal()">Сохранить запись</button>`;
}

function renderStats() {
  updateStreak();
  const doneCount = Object.values(state.done).filter(Boolean).length;
  const total = HABITS.length;
  const pct = getProgress();
  const days = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const todayDow = (new Date().getDay() + 6) % 7;

  let weekHtml = days.map((d,i) => {
    const isToday = i === todayDow;
    const isPast = i < todayDow;
    const key = new Date(Date.now() - (todayDow - i) * 86400000).toISOString().slice(0,10);
    const dayDone = load('done_' + key, {});
    const dayPct = Math.round(Object.values(dayDone).filter(Boolean).length / total * 100);
    const cls = isPast && dayPct > 50 ? 'done' : '';
    return `<div class="week-day ${cls} ${isToday?'today':''}">
      <span>${d}</span>
      ${isToday ? `<div class="week-dot"></div>` : (isPast ? `<span style="font-size:9px">${dayPct}%</span>` : '')}
    </div>`;
  }).join('');

  return `<div class="streak-card">
    <div class="streak-flame">🔥</div>
    <div>
      <div class="streak-val">${state.streak.count}</div>
      <div class="streak-label">дней подряд</div>
    </div>
  </div>
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-val" style="color:var(--accent2)">${doneCount}</div>
      <div class="stat-label">привычек сегодня</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:var(--accent)">${pct}%</div>
      <div class="stat-label">выполнение дня</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:var(--amber)">${totalCals()}</div>
      <div class="stat-label">калорий сегодня</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:var(--accent3)">${state.aiProgress}</div>
      <div class="stat-label">AI заданий пройдено</div>
    </div>
  </div>
  <div class="section-title">Неделя</div>
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:8px">
    <div class="week-row">${weekHtml}</div>
  </div>
  <div class="section-title">К цели $1M</div>
  <div class="ai-card">
    <div class="ai-task-title">Твой прогресс</div>
    <div class="ai-task-desc">AI заданий выполнено: <strong>${state.aiProgress}</strong> из ${AI_TASKS.length}<br>Фаза: <strong>${state.aiProgress < 3 ? 'Фундамент' : state.aiProgress < 5 ? 'Первые деньги' : 'Масштаб'}</strong></div>
    <div class="calorie-track" style="margin-top:8px"><div class="calorie-fill" style="width:${Math.round(state.aiProgress/AI_TASKS.length*100)}%;background:var(--accent)"></div></div>
  </div>`;
}

// ─── ACTIONS ────────────────────────────────────────────────────────────────
function toggleHabit(id) {
  state.done[id] = !state.done[id];
  save('done_' + todayKey(), state.done);
  if (state.done[id]) showToast('✓ Выполнено!');
  render();
}

function addMeal() {
  const name = document.getElementById('mealName').value.trim();
  const kcal = parseInt(document.getElementById('mealKcal').value);
  if (!name || !kcal || kcal <= 0) { showToast('Введи название и калории'); return; }
  state.meals.push({ name, kcal, protein:0, carbs:0, fat:0 });
  save('meals_' + todayKey(), state.meals);
  showToast('Добавлено: ' + kcal + ' ккал');
  render();
}

function deleteMeal(i) {
  state.meals.splice(i, 1);
  save('meals_' + todayKey(), state.meals);
  render();
}

function completeAITask() {
  if (state.aiDone) return;
  state.aiDone = true;
  state.aiProgress = Math.min(state.aiProgress + 1, AI_TASKS.length - 1);
  save('ai_done_' + todayKey(), true);
  save('ai_progress', state.aiProgress);
  showToast('🔥 Задание выполнено! +1 XP');
  render();
}

function saveJournal() {
  state.journal.gratitude = document.getElementById('j_gratitude').value;
  state.journal.lesson = document.getElementById('j_lesson').value;
  state.journal.tomorrow = document.getElementById('j_tomorrow').value;
  save('journal_' + todayKey(), state.journal);
  showToast('📓 Сохранено');
}

function bindEvents() {
  const mn = document.getElementById('mealName');
  const mk = document.getElementById('mealKcal');
  if (mn) mn.addEventListener('keydown', e => { if (e.key==='Enter') mk && mk.focus(); });
  if (mk) mk.addEventListener('keydown', e => { if (e.key==='Enter') addMeal(); });
}

// ─── INIT ────────────────────────────────────────────────────────────────────
const days = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const now = new Date();
document.getElementById('dateBadge').textContent =
  days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()];

try { window.Telegram?.WebApp?.ready(); window.Telegram?.WebApp?.expand(); } catch(e) {}

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily OS">
<meta name="theme-color" content="#080810">
<link rel="manifest" href="manifest.json">
<title>Daily OS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#080810;--bg1:#0d0d18;--bg2:#12121f;--bg3:#17172a;
  --glass:rgba(255,255,255,0.03);--glass2:rgba(255,255,255,0.06);--glass3:rgba(255,255,255,0.1);
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);--border3:rgba(255,255,255,0.16);
  --p:#6c63ff;--p2:#8b85ff;--p3:rgba(108,99,255,0.12);
  --teal:#00d4aa;--teal2:rgba(0,212,170,0.1);
  --amber:#f5a623;--amber2:rgba(245,166,35,0.1);
  --coral:#ff6b6b;--coral2:rgba(255,107,107,0.1);
  --blue:#4a9eff;--blue2:rgba(74,158,255,0.12);
  --text:rgba(255,255,255,0.9);--text2:rgba(255,255,255,0.6);--text3:rgba(255,255,255,0.3);
  --r:14px;--r-sm:10px;--r-lg:20px;
  --font-h:'Syne',sans-serif;--font-b:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:14px}
body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 60% 40% at 15% 10%,rgba(108,99,255,0.07) 0%,transparent 60%),radial-gradient(ellipse 50% 30% at 85% 85%,rgba(0,212,170,0.05) 0%,transparent 60%);pointer-events:none}
#app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column}

/* ONBOARDING */
#ob{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;animation:fadeIn .4s ease}
.ob-logo{font-family:var(--font-h);font-size:28px;font-weight:800;margin-bottom:6px;letter-spacing:-.02em}
.ob-logo span{color:var(--p2)}
.ob-tagline{font-size:12px;color:var(--text3);margin-bottom:32px;text-align:center;letter-spacing:.04em}
.ob-dots{display:flex;gap:6px;justify-content:center;margin-bottom:28px}
.ob-dot{width:6px;height:6px;border-radius:50%;background:var(--border2);transition:all .3s}
.ob-dot.on{width:20px;border-radius:3px;background:var(--p)}
.ob-card{width:100%;max-width:380px;animation:slideUp .3s ease}
.ob-step-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.ob-step-title{font-family:var(--font-h);font-size:22px;font-weight:700;margin-bottom:20px;line-height:1.2}
.ob-inp{width:100%;background:var(--glass2);border:1px solid var(--border2);border-radius:var(--r);padding:14px 16px;color:var(--text);font-size:15px;font-family:var(--font-b);outline:none;margin-bottom:10px;transition:border-color .2s}
.ob-inp:focus{border-color:var(--p)}
.ob-inp::placeholder{color:var(--text3)}
.ob-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.ob-opt{padding:14px 10px;background:var(--glass);border:1px solid var(--border);border-radius:var(--r);text-align:center;cursor:pointer;transition:all .2s;font-size:12px;color:var(--text2);line-height:1.4}
.ob-opt.on{background:var(--p3);border-color:var(--p);color:var(--p2)}
.ob-opt-ico{font-size:22px;display:block;margin-bottom:5px}
.ob-btn{width:100%;padding:15px;background:var(--p);border:none;border-radius:var(--r);color:#fff;font-size:14px;font-weight:700;font-family:var(--font-h);cursor:pointer;transition:all .2s;letter-spacing:.02em}
.ob-btn:active{opacity:.85;transform:scale(.98)}
.ob-multi{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.ob-tag{padding:8px 14px;background:var(--glass);border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--text2);cursor:pointer;transition:all .2s;font-weight:500}
.ob-tag.on{background:var(--p3);border-color:var(--p);color:var(--p2)}
.ob-row{display:flex;gap:8px;margin-bottom:10px}
.ob-half{flex:1}

/* HEADER */
.hdr{padding:14px 18px 10px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(8,8,16,0.9);backdrop-filter:blur(20px)}
.hdr-brand{font-family:var(--font-h);font-size:20px;font-weight:800;letter-spacing:-.02em}
.hdr-brand span{color:var(--p2)}
.hdr-right{display:flex;align-items:center;gap:8px}
.hdr-streak{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--coral);background:var(--coral2);padding:5px 10px;border-radius:20px}
.hdr-date{font-size:10px;color:var(--text3);font-weight:500}
.lang-toggle{display:flex;gap:2px;background:var(--glass);border:1px solid var(--border);border-radius:20px;padding:3px}
.lang-btn{padding:3px 8px;border-radius:16px;font-size:10px;font-weight:700;cursor:pointer;color:var(--text3);transition:all .2s;border:none;background:transparent;font-family:var(--font-b)}
.lang-btn.on{background:var(--p);color:#fff}

/* PROGRESS */
.prog{padding:9px 18px;flex-shrink:0;border-bottom:1px solid var(--border)}
.prog-row{display:flex;justify-content:space-between;margin-bottom:5px;font-size:10px}
.prog-lbl{color:var(--text3);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.prog-val{color:var(--teal);font-family:var(--font-h);font-weight:700}
.prog-track{height:3px;background:var(--glass2);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--teal));border-radius:2px;transition:width .5s ease}

/* NAV */
.nav{display:flex;gap:4px;padding:8px 18px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{flex-shrink:0;padding:6px 13px;border-radius:20px;font-size:11px;font-weight:600;font-family:var(--font-b);border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;transition:all .2s;white-space:nowrap;letter-spacing:.02em}
.nav-btn.on{background:var(--p);border-color:var(--p);color:#fff}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:14px 18px 90px;scrollbar-width:none;scroll-behavior:smooth}
.content::-webkit-scrollbar{display:none}

/* COMMON */
.stitle{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:18px 0 9px}
.stitle:first-child{margin-top:0}
.card{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:8px}
.glass-card{background:rgba(255,255,255,0.03);border:1px solid var(--border2);border-radius:var(--r-lg);padding:20px;margin-bottom:10px;position:relative;overflow:hidden}
.glass-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent)}
.inp{background:var(--glass2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 13px;color:var(--text);font-size:13px;font-family:var(--font-b);outline:none;transition:border-color .2s;width:100%}
.inp:focus{border-color:var(--p)}
.inp::placeholder{color:var(--text3)}
.btn-main{background:var(--p);border:none;border-radius:var(--r-sm);padding:13px;color:#fff;font-size:13px;font-weight:700;font-family:var(--font-h);cursor:pointer;transition:all .2s;width:100%;letter-spacing:.02em}
.btn-main:active{opacity:.85}
.btn-sec{background:var(--glass);border:1px solid var(--border2);border-radius:var(--r-sm);padding:11px 16px;color:var(--text2);font-size:12px;font-weight:600;font-family:var(--font-b);cursor:pointer}
.ai-bubble{background:rgba(108,99,255,0.08);border:1px solid rgba(108,99,255,0.15);border-radius:var(--r-sm);padding:12px 14px;font-size:12px;color:var(--text2);line-height:1.6;font-style:italic}
.ai-bubble::before{content:'✦ ';color:var(--p2)}

/* HOME / DAY PLAN */
.hero{background:linear-gradient(135deg,rgba(108,99,255,0.14),rgba(0,212,170,0.07));border:1px solid rgba(108,99,255,0.18);border-radius:var(--r-lg);padding:20px;margin-bottom:10px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(108,99,255,0.15),transparent)}
.hero-greet{font-size:11px;color:var(--text3);margin-bottom:3px;font-weight:500;letter-spacing:.04em}
.hero-name{font-family:var(--font-h);font-size:24px;font-weight:800;margin-bottom:12px;line-height:1.1}
.hero-name em{color:var(--p2);font-style:normal}
.energy-row{display:flex;gap:6px;margin-bottom:12px}
.energy-btn{flex:1;padding:8px 4px;background:var(--glass);border:1px solid var(--border);border-radius:var(--r-sm);text-align:center;cursor:pointer;transition:all .2s;font-size:10px;color:var(--text3);font-weight:500}
.energy-btn.on{border-color:var(--p);color:var(--p2);background:var(--p3)}
.energy-ico{font-size:16px;display:block;margin-bottom:2px}

/* DAY PLAN ITEMS */
.plan-item{display:flex;align-items:stretch;gap:10px;margin-bottom:6px;cursor:pointer;transition:all .2s}
.plan-item:active{opacity:.8}
.plan-time-col{width:44px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:0}
.plan-time-txt{font-size:10px;font-weight:700;color:var(--text3);font-family:var(--font-h);padding-top:10px}
.plan-line{width:1px;flex:1;background:var(--border);margin-top:4px}
.plan-body{flex:1;background:var(--glass);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;position:relative;overflow:hidden;transition:all .2s}
.plan-body.done{border-color:rgba(0,212,170,0.2);background:rgba(0,212,170,0.04)}
.plan-body.done::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--teal);border-radius:3px 0 0 3px}
.plan-body-top{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.plan-ico{font-size:18px;flex-shrink:0}
.plan-title{font-size:13px;font-weight:500;color:var(--text);flex:1}
.plan-body.done .plan-title{color:var(--text3);text-decoration:line-through}
.plan-cat{font-size:9px;padding:2px 7px;border-radius:20px;background:var(--p3);color:var(--p2);font-weight:700;flex-shrink:0}
.cat-morning{background:rgba(0,212,170,0.12)!important;color:#00d4aa!important}
.cat-sport{background:rgba(255,107,107,0.12)!important;color:#ff6b6b!important}
.cat-work{background:rgba(108,99,255,0.12)!important;color:#6c63ff!important}
.cat-food{background:rgba(245,166,35,0.12)!important;color:#f5a623!important}
.cat-learning{background:rgba(74,158,255,0.12)!important;color:#4a9eff!important}
.cat-evening{background:rgba(212,83,126,0.12)!important;color:#d4537e!important}
.cat-mind{background:rgba(139,133,255,0.12)!important;color:#8b85ff!important}
.cat-health{background:rgba(48,209,88,0.12)!important;color:#30d158!important}
.cat-creative{background:rgba(255,159,67,0.12)!important;color:#ff9f43!important}
.cat-pet{background:rgba(255,209,102,0.12)!important;color:#ffd166!important}
.plan-chk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .2s}
.plan-body.done .plan-chk{background:var(--teal);border-color:var(--teal);color:#fff}
.plan-sub{font-size:11px;color:var(--text3);padding-left:26px}
.plan-actions{display:flex;gap:6px;margin-top:8px;padding-left:26px}
.plan-action-btn{padding:5px 10px;background:var(--glass2);border:1px solid var(--border);border-radius:20px;font-size:10px;color:var(--text3);cursor:pointer;transition:all .2s;font-family:var(--font-b);font-weight:500}
.plan-action-btn:active{background:var(--p3);border-color:var(--p);color:var(--p2)}
.add-plan-btn{width:100%;padding:12px;background:var(--glass);border:1px dashed var(--border2);border-radius:var(--r);color:var(--text3);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;font-family:var(--font-b);margin-top:6px}
.add-plan-btn:active{border-color:var(--p);color:var(--p2)}

/* HABIT LIBRARY */
.lib-search{display:flex;gap:8px;margin-bottom:12px}
.lib-cats{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.lib-cat{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;transition:all .2s}
.lib-cat.on{background:var(--p);border-color:var(--p);color:#fff}
.lib-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lib-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--glass);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:all .2s}
.lib-item.added{border-color:rgba(0,212,170,0.3);background:var(--teal2)}
.lib-item:active{transform:scale(.97)}
.lib-ico{font-size:20px;flex-shrink:0}
.lib-name{font-size:12px;font-weight:500;color:var(--text2);flex:1;line-height:1.3}
.lib-add{font-size:16px;color:var(--text3);transition:all .2s}
.lib-item.added .lib-add{color:var(--teal)}

/* HEALTH */
.health-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.health-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.health-ico{font-size:24px;margin-bottom:6px}
.health-val{font-family:var(--font-h);font-size:22px;font-weight:800;line-height:1;margin-bottom:3px}
.health-lbl{font-size:9px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.rating-row{display:flex;gap:3px;flex-wrap:wrap}
.r-btn{width:28px;height:28px;border-radius:7px;background:var(--glass);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text3);cursor:pointer;transition:all .2s}
.r-btn.on{background:var(--p3);border-color:var(--p);color:var(--p2)}
.water-row{display:flex;gap:5px;flex-wrap:wrap}
.water-g{width:30px;height:38px;border-radius:6px;border:1.5px solid var(--border2);overflow:hidden;cursor:pointer;position:relative;background:var(--glass)}
.water-g.full{border-color:var(--blue)}
.water-f{position:absolute;bottom:0;left:0;right:0;background:var(--blue);transition:height .3s}
.mood-row{display:flex;gap:8px;flex-wrap:wrap}
.mood-btn{padding:8px 12px;background:var(--glass);border:1px solid var(--border);border-radius:var(--r-sm);font-size:18px;cursor:pointer;transition:all .2s}
.mood-btn.on{background:var(--p3);border-color:var(--p);transform:scale(1.1)}

/* NUTRITION */
.kcal-card{background:rgba(255,255,255,0.03);border:1px solid rgba(245,166,35,0.15);border-radius:var(--r-lg);padding:18px;margin-bottom:10px}
.kcal-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.kcal-num{font-family:var(--font-h);font-size:40px;font-weight:800;line-height:1}
.kcal-sub{font-size:11px;color:var(--text3);margin-top:3px}
.kcal-goal-v{font-family:var(--font-h);font-size:18px;font-weight:700;color:var(--amber);text-align:right}
.kcal-goal-l{font-size:10px;color:var(--text3);text-align:right}
.kcal-track{height:5px;background:var(--glass2);border-radius:5px;overflow:hidden;margin-bottom:12px}
.kcal-fill{height:100%;border-radius:5px;transition:width .4s;background:linear-gradient(90deg,var(--amber),var(--coral))}
.macro-row{display:flex;gap:6px;margin-bottom:12px}
.macro-item{flex:1;background:var(--glass);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px;text-align:center}
.macro-v{font-family:var(--font-h);font-size:14px;font-weight:700}
.macro-l{font-size:9px;color:var(--text3);margin-top:1px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.inp-row{display:flex;gap:6px;margin-bottom:0}
.inp-sm{width:68px;flex:none}
.btn-add{background:var(--p);border:none;border-radius:var(--r-sm);padding:10px 13px;color:#fff;font-size:16px;cursor:pointer;transition:opacity .2s;flex-shrink:0}
.btn-add:active{opacity:.8}
.meal-list{margin-top:10px}
.meal-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.meal-item:last-child{border-bottom:none}
.meal-kcal{color:var(--amber);font-weight:700;font-family:var(--font-h)}
.meal-del{color:var(--text3);cursor:pointer;padding:0 4px;font-size:18px}
.photo-btn{width:100%;padding:12px;background:var(--glass);border:1px dashed var(--border2);border-radius:var(--r);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;font-family:var(--font-b);margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.photo-btn:active{border-color:var(--p);color:var(--p2)}
.goal-banner{display:flex;align-items:center;gap:12px;background:var(--teal2);border:1px solid rgba(0,212,170,0.2);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.goal-ico{font-size:24px;flex-shrink:0}
.goal-info{flex:1}
.goal-title{font-size:13px;font-weight:600;margin-bottom:2px}
.goal-sub{font-size:11px;color:var(--text3)}
.goal-pct{font-family:var(--font-h);font-size:16px;font-weight:700;color:var(--teal)}
.rec-item{display:flex;align-items:center;gap:12px;padding:11px 13px;background:var(--glass);border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px}

/* AI LEARNING */
.learn-card{background:rgba(255,255,255,0.03);border:1px solid rgba(108,99,255,0.15);border-radius:var(--r-lg);padding:18px;margin-bottom:10px}
.learn-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.learn-badge{background:var(--p3);border:1px solid rgba(108,99,255,0.25);border-radius:20px;padding:4px 12px;font-size:10px;color:var(--p2);font-weight:700}
.learn-title{font-family:var(--font-h);font-size:16px;font-weight:700;margin-bottom:7px}
.learn-desc{font-size:12px;color:var(--text2);line-height:1.7;margin-bottom:12px}
.learn-tips{background:rgba(0,0,0,.2);border-radius:var(--r-sm);padding:11px;margin-bottom:12px}
.learn-tips-title{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--p2);margin-bottom:7px}
.learn-tip{font-size:12px;color:var(--text2);padding:2px 0;line-height:1.5}
.learn-tip::before{content:'→ ';color:var(--teal)}
.learn-subject{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subject-btn{padding:7px 14px;background:var(--glass);border:1px solid var(--border);border-radius:20px;font-size:11px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .2s;font-family:var(--font-b)}
.subject-btn.on{background:var(--p3);border-color:var(--p);color:var(--p2)}
.complete-btn{width:100%;padding:13px;border-radius:var(--r-sm);background:var(--p);border:none;color:#fff;font-size:13px;font-weight:700;font-family:var(--font-h);cursor:pointer;transition:all .2s}
.complete-btn.done{background:var(--glass2);color:var(--text3)}
.complete-btn:active{opacity:.85}

/* JOURNAL */
.j-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:8px}
.j-prompt{font-size:10px;color:var(--text3);margin-bottom:7px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.j-ta{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;color:var(--text);font-size:13px;font-family:var(--font-b);line-height:1.6;resize:none;outline:none;min-height:75px;transition:border-color .2s}
.j-ta:focus{border-color:var(--p)}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.note-tag{padding:5px 12px;background:var(--glass);border:1px solid var(--border);border-radius:20px;font-size:11px;color:var(--text2);cursor:pointer;transition:all .2s;font-weight:500}
.note-tag.on{background:var(--p3);border-color:var(--p);color:var(--p2)}
.note-item{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);padding:13px;margin-bottom:6px}
.note-item-title{font-size:13px;font-weight:500;margin-bottom:4px}
.note-item-text{font-size:12px;color:var(--text2);line-height:1.5}
.note-item-meta{font-size:10px;color:var(--text3);margin-top:6px}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.stat-val{font-family:var(--font-h);font-size:26px;font-weight:800;line-height:1;margin-bottom:3px}
.stat-lbl{font-size:10px;color:var(--text3);font-weight:500}
.stat-trend{font-size:10px;margin-top:4px}
.trend-up{color:var(--teal)}
.trend-dn{color:var(--coral)}
.week-row{display:flex;gap:5px}
.week-d{flex:1;border-radius:9px;background:var(--glass);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:5px 3px;gap:3px;font-size:9px;color:var(--text3);font-weight:600;position:relative;overflow:hidden;aspect-ratio:.55}
.week-d.ok{background:rgba(0,212,170,0.08);color:var(--teal)}
.week-d.today{border:1px solid var(--p)}
.week-bar{width:100%;border-radius:3px;background:var(--p);position:absolute;bottom:0;left:0;opacity:.4}
.week-d.ok .week-bar{opacity:.6;background:var(--teal)}
.corr-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.corr-item:last-child{border-bottom:none}
.corr-ico{font-size:18px;width:28px;text-align:center}
.corr-text{flex:1;font-size:12px;color:var(--text2)}
.corr-val{font-size:12px;font-weight:700;color:var(--teal);font-family:var(--font-h)}
.prod-ring{text-align:center;padding:20px 0}
.prod-score{font-family:var(--font-h);font-size:60px;font-weight:800;background:linear-gradient(135deg,var(--p2),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.prod-lbl{font-size:12px;color:var(--text3);margin-top:4px}

/* SETTINGS */
.profile-card{display:flex;align-items:center;gap:14px;background:var(--glass);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:14px}
.avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--teal));display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-size:20px;font-weight:800;color:#fff;flex-shrink:0}
.profile-name{font-family:var(--font-h);font-size:17px;font-weight:700}
.profile-goal{font-size:11px;color:var(--text3);margin-top:2px}
.sett-section{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.sett-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .2s}
.sett-item:last-child{border-bottom:none}
.sett-item:active{background:var(--glass2)}
.sett-ico{font-size:17px;width:28px;text-align:center}
.sett-text{flex:1}
.sett-label{font-size:13px;font-weight:500}
.sett-sub{font-size:10px;color:var(--text3);margin-top:1px}
.sett-arr{color:var(--text3);font-size:15px}
.sleep-nums{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.sleep-num{width:30px;height:30px;border-radius:7px;background:var(--glass);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text3);cursor:pointer;transition:all .2s}
.sleep-num.on{background:var(--p3);border-color:var(--p);color:var(--p2)}

/* CHAT */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 210px)}
.chat-msgs{flex:1;overflow-y:auto;padding-bottom:8px;scrollbar-width:none}
.chat-msgs::-webkit-scrollbar{display:none}
.chat-msg{margin-bottom:10px;display:flex;flex-direction:column}
.chat-msg.bot .bubble{background:var(--glass);border:1px solid var(--border);border-radius:14px 14px 14px 4px;align-self:flex-start;max-width:88%}
.chat-msg.user .bubble{background:var(--p);border-radius:14px 14px 4px 14px;align-self:flex-end;max-width:88%}
.bubble{padding:10px 13px;font-size:13px;line-height:1.55}
.bubble-time{font-size:10px;color:var(--text3);margin-top:3px;padding:0 4px}
.chat-msg.user .bubble-time{text-align:right}
.chat-empty{text-align:center;padding:30px 20px;color:var(--text3)}
.chat-empty-ico{font-size:36px;margin-bottom:10px}
.qp-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.qp-btn{padding:6px 11px;background:var(--glass);border:1px solid var(--border);border-radius:20px;font-size:11px;color:var(--text2);cursor:pointer;transition:all .2s;font-family:var(--font-b);font-weight:500;white-space:nowrap}
.qp-btn:active{background:var(--p3);border-color:var(--p);color:var(--p2)}
.chat-inp-wrap{display:flex;gap:7px;padding-top:9px;border-top:1px solid var(--border);flex-shrink:0}
.chat-inp{flex:1;background:var(--glass2);border:1px solid var(--border);border-radius:20px;padding:10px 15px;color:var(--text);font-size:13px;font-family:var(--font-b);outline:none;transition:border-color .2s}
.chat-inp:focus{border-color:var(--p)}
.chat-inp::placeholder{color:var(--text3)}
.btn-send{width:40px;height:40px;border-radius:50%;background:var(--p);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;transition:all .2s}
.btn-send:active{transform:scale(.9)}
.typing{display:flex;gap:4px;padding:10px 13px}
.dot-t{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:tb .9s infinite}
.dot-t:nth-child(2){animation-delay:.15s}
.dot-t:nth-child(3){animation-delay:.3s}
@keyframes tb{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* BOTTOM BAR */
.bar{position:fixed;bottom:0;left:0;right:0;background:rgba(8,8,16,0.95);border-top:1px solid var(--border);display:flex;padding:7px 0 max(7px,env(safe-area-inset-bottom));z-index:100;backdrop-filter:blur(24px)}
.bar-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--text3);transition:color .2s;padding:3px 0}
.bar-item.on{color:var(--p2)}
.bar-ico{font-size:21px;line-height:1}
.bar-lbl{font-size:9px;font-weight:600;letter-spacing:.02em}

/* TOAST */
.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--glass2);border:1px solid var(--border2);border-radius:22px;padding:9px 18px;font-size:12px;font-weight:500;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:200;backdrop-filter:blur(20px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* FOCUS TIMER */
.focus-bar{position:fixed;top:0;left:0;right:0;background:var(--p);padding:8px 18px;display:flex;align-items:center;justify-content:space-between;z-index:500;transform:translateY(-100%);transition:transform .3s}
.focus-bar.show{transform:translateY(0)}
.focus-bar-time{font-family:var(--font-h);font-size:16px;font-weight:700;color:#fff}
.focus-bar-label{font-size:11px;color:rgba(255,255,255,.7)}
.focus-bar-stop{background:rgba(255,255,255,.2);border:none;border-radius:20px;padding:5px 12px;color:#fff;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font-b)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes habitPulse{0%{transform:scale(1)}30%{transform:scale(1.05);box-shadow:0 0 0 8px rgba(0,212,170,0.2)}60%{transform:scale(0.98);box-shadow:0 0 0 14px rgba(0,212,170,0.05)}100%{transform:scale(1);box-shadow:none}}
.habit-pulse{animation:habitPulse 0.5s ease forwards}
@keyframes checkPop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.plan-chk{animation:checkPop 0.3s ease}
@keyframes xpFloat{0%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-60px)}}
@keyframes waterFill{from{height:0%}to{height:100%}}

if(!S.dayPlan.length && S.myHabits.length) {
  S.dayPlan = S.myHabits.map(id=>{
    const h = HABIT_LIB.find(x=>x.id===id);
    return h ? {id:h.id,done:false} : null;
  }).filter(Boolean);
  sv('day_plan_'+tk(),S.dayPlan);
}

function updStreak(){
  const today=tk(),yest=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(S.streak.last===today)return;
  S.streak.count=S.streak.last===yest?S.streak.count+1:1;
  S.streak.last=today;sv('streak',S.streak);
}

function getPct(){
  if(!S.dayPlan.length)return 0;
  return Math.round(S.dayPlan.filter(x=>x.done).length/S.dayPlan.length*100);
}

function refreshTop(){
  const p=getPct();
  document.getElementById('progVal').textContent=p+'%';
  document.getElementById('progFill').style.width=p+'%';
  document.getElementById('streakNum').textContent=S.streak.count;
  document.getElementById('progLbl').textContent=t().progress;
  // lang btns
  document.getElementById('langRU').classList.toggle('on',lang==='ru');
  document.getElementById('langEN').classList.toggle('on',lang==='en');
  const badge=document.getElementById('xpBadge');
  if(badge){const lvl=getLevel(S.xp);badge.textContent=lvl.ico+' '+S.xp+' XP';badge.style.display='block';}
}

  const nb=document.getElementById('navBar');
  nb.innerHTML=TABS.map(id=>`<button class="nav-btn ${S.tab===id?'on':''}" onclick="tab('${id}')">${t()[id]||id}</button>`).join('');

  const barIcos={home:'🏠',habits:'📚',chat:'💬',stats:'📊',settings:'⚙️'};

function startFocusFor(name){
  S.focus.task=name;S.focus.elapsed=0;S.focus.running=true;
  startFocusTimer();toast('⏱ Focus: '+name);
}

function startFocusTimer(){
  if(S.focusInterval)clearInterval(S.focusInterval);
  document.getElementById('focusBar').classList.add('show');
  document.getElementById('focusBarLabel').textContent=S.focus.task;
  S.focusInterval=setInterval(()=>{
    S.focus.elapsed++;
    const rem=Math.max(0,S.focus.total-S.focus.elapsed);
    const m=Math.floor(rem/60),s=rem%60;
    document.getElementById('focusBarTime').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if(rem<=0)stopFocus();
  },1000);
}

function stopFocus(){
  clearInterval(S.focusInterval);S.focus.running=false;
  document.getElementById('focusBar').classList.remove('show');
  const min=Math.round(S.focus.elapsed/60);
  if(min>0)toast(`🔥 ${min}m focused!`);
}

function toggleHabit(id){

// ── HEALTH ───────────────────────────────────────────────────────────────────
function rHealth(){
  const h=S.health;
  // SVG Radar chart
  const _rCx=110,_rCy=110,_rMax=90;
  const _rAngDeg=[-90,-30,30,90,150,210];
  const _rRad=deg=>deg*Math.PI/180;
  const _rPt=(v,deg)=>{const r=(v/10)*_rMax;return{x:_rCx+r*Math.cos(_rRad(deg)),y:_rCy+r*Math.sin(_rRad(deg))};};
  const _rPts=vals=>_rAngDeg.map((deg,i)=>_rPt(vals[i],deg));
  const _rStr=pts=>pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const _rVals=[h.sleep||0,h.focus||0,h.stress||0,h.energy||0,h.mood||0,Math.round((h.water||0)/8*10)];
  const grids=[2,4,6,8,10].map(lv=>`<polygon points="${_rStr(_rPts([lv,lv,lv,lv,lv,lv]))}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>`).join('');
  const axes=_rAngDeg.map(deg=>{const ex=(_rCx+_rMax*Math.cos(_rRad(deg))).toFixed(1),ey=(_rCy+_rMax*Math.sin(_rRad(deg))).toFixed(1);return `<line x1="${_rCx}" y1="${_rCy}" x2="${ex}" y2="${ey}" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>`;}).join('');
  const dataPts=_rStr(_rPts(_rVals));
  const _rLbls=[{t:lang==='ru'?'Сон':'Sleep',deg:-90},{t:lang==='ru'?'Фокус':'Focus',deg:-30},{t:lang==='ru'?'Стресс':'Stress',deg:30},{t:lang==='ru'?'Энергия':'Energy',deg:90},{t:lang==='ru'?'Настроение':'Mood',deg:150},{t:lang==='ru'?'Вода':'Water',deg:210}];
  const lbls=_rLbls.map(l=>{const lx=(_rCx+105*Math.cos(_rRad(l.deg))).toFixed(1),ly=(_rCy+105*Math.sin(_rRad(l.deg))).toFixed(1);return `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="rgba(255,255,255,0.45)" font-family="DM Sans,sans-serif">${l.t}</text>`;}).join('');
  const scoreVal=Math.round(_rVals.reduce((a,b)=>a+b,0)/6*10);
  const radarSVG=`<svg width="220" height="220" viewBox="0 0 220 220">${grids}${axes}<polygon points="${dataPts}" fill="rgba(108,99,255,0.25)" stroke="#6c63ff" stroke-width="2"/>${lbls}<text x="${_rCx}" y="${_rCy+5}" text-anchor="middle" font-size="22" font-weight="800" fill="rgba(255,255,255,0.9)" font-family="Syne,sans-serif">${scoreVal}%</text></svg>`;

  const metrics=[
    {key:'sleep',ico:'😴',lbl:t().sleep},
    {key:'focus',ico:'🎯',lbl:t().focus},
    {key:'stress',ico:'😰',lbl:t().stress},
    {key:'energy',ico:'⚡',lbl:t().energy},
  ];
  const waterGlasses=Array.from({length:8},(_,i)=>`<div class="water-g ${i<h.water?'full':''}" onclick="setWater(${i+1})"><div class="water-f" style="height:${i<h.water?100:0}%"></div></div>`).join('');
  const moods=['😴','😔','😐','😊','🔥'];

function selectBreath(id){S.breathPattern=id;sv('breath_pattern',id);if(_breathRunning)stopBreath();else render();}
function startBreath(){
  const p=BREATH_PATTERNS.find(x=>x.id===S.breathPattern)||BREATH_PATTERNS[0];
  _breathRunning=true;_breathPhase='inhale';_breathCount=p.inhale;_breathCycles=0;
  _breathInterval=setInterval(breathTick,1000);render();
}
function stopBreath(){clearInterval(_breathInterval);_breathRunning=false;_breathCount=0;_breathCycles=0;render();}
function breathTick(){
  const p=BREATH_PATTERNS.find(x=>x.id===S.breathPattern)||BREATH_PATTERNS[0];
  _breathCount--;
  if(_breathCount<=0){
    const phases=['inhale','hold1','exhale','hold2'].filter(ph=>p[ph]>0);
    const idx=phases.indexOf(_breathPhase);
    const next=phases[(idx+1)%phases.length];
    if(next==='inhale')_breathCycles++;
    _breathPhase=next;_breathCount=p[next]||1;
  }
  const labels={inhale:{ru:'Вдох',en:'Inhale'},hold1:{ru:'Задержка',en:'Hold'},exhale:{ru:'Выдох',en:'Exhale'},hold2:{ru:'Задержка',en:'Hold'}};
  const el=document.getElementById('breathCount');const lbl=document.getElementById('breathLabel');const ce=document.getElementById('breathCycles');
  if(el)el.textContent=_breathCount;if(lbl)lbl.textContent=labels[_breathPhase][lang];if(ce)ce.textContent=_breathCycles;
}

// ── NUTRITION ─────────────────────────────────────────────────────────────────
function rNutrition(){
  const nutGoal=S.user.nutGoal||'lose';
  const goal=S.user.targetWeight&&S.user.targetWeight<S.user.weight?'lose':'gain';
  const bmr=Math.round(10*S.user.weight+6.25*S.user.height-5*30+(goal==='lose'?5:-161));
  const kcalGoal=Math.round(bmr*(S.user.activityLevel==='low'?1.375:S.user.activityLevel==='medium'?1.55:1.725));
  const total=S.meals.reduce((s,m)=>s+m.kcal,0);
  const pct=Math.min(100,Math.round(total/kcalGoal*100)),over=total>kcalGoal;

function addMeal(){
  const n=document.getElementById('mName')?.value.trim();
  const k=parseInt(document.getElementById('mKcal')?.value);
  if(!n||!k||k<=0){toast(lang==='ru'?'Введи название и калории':'Enter name and calories');return;}
  const p=parseInt(document.getElementById('mProt')?.value)||0;
  const c=parseInt(document.getElementById('mCarb')?.value)||0;
  const f=parseInt(document.getElementById('mFat')?.value)||0;
  S.meals.push({name:n,kcal:k,p,c,f});
  sv('meals_'+tk(),S.meals);sv('total_meals_logged',ld('total_meals_logged',0)+1);addXP(5);render();
}
function delMeal(i){S.meals.splice(i,1);sv('meals_'+tk(),S.meals);render();}

async function photoFood(){
  if(!getKey()){toast(lang==='ru'?'Нужен OpenAI ключ':'Need OpenAI key');tab('settings');return;}
  const input=document.createElement('input');input.type='file';input.accept='image/*';input.capture='environment';
  input.onchange=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    toast('⏳ '+(lang==='ru'?'Анализирую...':'Analyzing...'));
    const reader=new FileReader();
    reader.onload=async(ev)=>{
      const b64=ev.target.result.split(',')[1];
      try{
        const res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getKey()},body:JSON.stringify({model:'gpt-4o-mini',max_tokens:150,messages:[{role:'user',content:[{type:'image_url',image_url:{url:'data:image/jpeg;base64,'+b64}},{type:'text',text:`Identify the food and estimate nutrition. Return ONLY valid JSON, no markdown: {"name":"food name in ${lang==='ru'?'Russian':'English'}","kcal":number,"protein":number,"carbs":number,"fat":number}`}]}]})});
        const data=await res.json();
        const text=data.choices?.[0]?.message?.content||'{}';
        const parsed=JSON.parse(text.replace(/```json|```/g,'').trim());
        if(parsed.name&&parsed.kcal){S.meals.push({name:parsed.name,kcal:parsed.kcal,p:parsed.protein||0,c:parsed.carbs||0,f:parsed.fat||0});sv('meals_'+tk(),S.meals);toast(`✓ ${parsed.name}: ${parsed.kcal} kcal`);render();}
      }catch(e){toast('Error');}
    };reader.readAsDataURL(file);
  };input.click();
}

function toggleAllergy(id){
  const idx=S.user.allergies.indexOf(id);
  if(idx>=0)S.user.allergies.splice(idx,1);else S.user.allergies.push(id);
  sv('user',S.user);render();
}
function setNutGoal(goal){S.user.nutGoal=goal;sv('user',S.user);render();}
async function searchRecipeAI(){
  if(!getKey()){toast(lang==='ru'?'Нужен OpenAI ключ':'Need OpenAI key');tab('settings');return;}
  const query=document.getElementById('recipeSearchAI')?.value.trim();
  if(!query){toast(lang==='ru'?'Введи название рецепта':'Enter recipe name');return;}
  toast('⏳ '+(lang==='ru'?'Ищу рецепт...':'Searching recipe...'));
  try{
    const allergies=S.user.allergies?.join(', ')||'none';
    const nutGoal=S.user.nutGoal||'lose';
    const res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getKey()},body:JSON.stringify({model:'gpt-4o-mini',max_tokens:500,messages:[{role:'user',content:`Create a healthy recipe for: "${query}". User goal: ${nutGoal} weight. Allergies: ${allergies}. Return ONLY valid JSON: {"name":"recipe name","ico":"one emoji","kcal":number,"protein":number,"carbs":number,"fat":number,"time":number,"steps":["step1","step2","step3"],"ingredients":["item1","item2"],"tip":"one cooking tip"}. Language: ${lang==='ru'?'Russian':'English'}.`}]})});
    const data=await res.json();
    const text=data.choices?.[0]?.message?.content||'{}';
    const recipe=JSON.parse(text.replace(/```json|```/g,'').trim());
    if(recipe.name){S.foundRecipe=recipe;sv('found_recipe',recipe);toast('✓ '+(lang==='ru'?'Рецепт найден!':'Recipe found!'));render();}
  }catch(e){toast(lang==='ru'?'Ошибка поиска':'Search error');}
}
function setNutriTab(tab){S.nutriTab=tab;render();}
function setRecipeSearch(v){S.recipeSearch=v;render();}
async function getAINutritionist(){
  if(!getKey()){toast(lang==='ru'?'Нужен OpenAI ключ':'Need OpenAI key');tab('settings');return;}
  const nutGoal=S.user.nutGoal||'lose';
  const totalCals=S.meals.reduce((s,m)=>s+m.kcal,0);
  const bmr=Math.round(10*S.user.weight+6.25*S.user.height-5*30+(nutGoal==='lose'?5:-161));
  const kcalGoal=Math.round(bmr*(S.user.activityLevel==='low'?1.375:S.user.activityLevel==='medium'?1.55:1.725));
  toast('⏳ '+(lang==='ru'?'Анализирую...':'Analyzing...'));
  try{
    const res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getKey()},body:JSON.stringify({model:'gpt-4o-mini',max_tokens:400,messages:[{role:'user',content:`You are a professional nutritionist. Based on: weight ${S.user.weight}kg, height ${S.user.height}cm, target ${S.user.targetWeight}kg, goal: ${nutGoal}, allergies: ${S.user.allergies?.join(', ')||'none'}, today's calories: ${totalCals}/${kcalGoal}. Give: 1) Daily calorie target 2) Macro breakdown (protein/carbs/fat in grams) 3) Meal timing recommendations 4) Top 3 food recommendations 5) Foods to avoid. Language: ${lang==='ru'?'Russian':'English'}. Be specific and practical.`}]})});
    const data=await res.json();
    const advice=data.choices?.[0]?.message?.content||'';
    if(advice){sv('nutritionist_advice_'+tk(),advice);toast('✅ '+(lang==='ru'?'Готово!':'Done!'));render();}
  }catch(e){toast('Error');}
}
function addRecipeToLog(id){
  const r=RECIPES.find(x=>x.id===id);if(!r)return;
  S.meals.push({name:r.name[lang]||r.name.en,kcal:r.kcal,p:r.protein,c:r.carbs,f:r.fat});
  sv('meals_'+tk(),S.meals);toast('+'+r.kcal+' kcal');S.nutriTab='log';render();
}
function logAIMenuItem(id){addRecipeToLog(id);}
async function generateAIMenu(){
  if(!getKey()){toast(lang==='ru'?'Нужен OpenAI ключ':'Need OpenAI key');tab('settings');return;}
  toast('⏳ '+(lang==='ru'?'Генерирую меню...':'Generating menu...'));
  const allergyMap={'gluten_free':'gluten','lactose_free':'lactose','no_nuts':'nuts','no_seafood':'seafood'};
  const userAllergens=S.user.allergies.map(a=>allergyMap[a]).filter(Boolean);
  const available=RECIPES.filter(r=>!userAllergens.some(a=>r.allergies.includes(a)));
  const goal=S.user.targetWeight&&S.user.targetWeight<S.user.weight?'lose weight':'maintain/gain';
  const recipeList=available.map(r=>`${r.id}: ${r.name.en} (${r.kcal}kcal, goal:${r.goal.join('/')})`).join('\n');
  try{
    const res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getKey()},body:JSON.stringify({model:'gpt-4o-mini',max_tokens:150,messages:[
      {role:'system',content:'You are a nutritionist. Return ONLY a JSON object with recipe IDs. Format: {"breakfast":"recipe_id","lunch":"recipe_id","dinner":"recipe_id","snack":"recipe_id"}. No markdown.'},
      {role:'user',content:`User: weight ${S.user.weight}kg, goal: ${goal}. Available recipes:\n${recipeList}\nPick the best breakfast, lunch, dinner and snack.`}
    ]})});
    const data=await res.json();

function selectAnswer(qi,oi){if(!S.quizState||S.quizState.submitted)return;S.quizState.answers[qi]=oi;render();}
function submitQuiz(){
  if(!S.quizState)return;
  const subj=S.aiSubject||'ai';
  const allLessons=getLessons(subj);

  const lesson=allLessons[Math.min(prog,allLessons.length-1)];

  lesson.quiz.forEach((q,i)=>{if(S.quizState.answers[i]===q.correct)score++;});

function getLevel(xp){
  const levels=[
    {min:0,name:{ru:'Новичок',en:'Beginner'},ico:'🌱'},
    {min:100,name:{ru:'Ученик',en:'Apprentice'},ico:'📚'},
    {min:250,name:{ru:'Практик',en:'Practitioner'},ico:'⚡'},
    {min:500,name:{ru:'Мастер',en:'Master'},ico:'🔥'},
    {min:1000,name:{ru:'Эксперт',en:'Expert'},ico:'💎'},
    {min:2000,name:{ru:'Легенда',en:'Legend'},ico:'🚀'},
  ];
  let lvl=levels[0];
  for(const l of levels){if(xp>=l.min)lvl=l;}
  const idx=levels.indexOf(lvl);
  const next=levels[idx+1]||null;
  return {name:lvl.name,ico:lvl.ico,curr:lvl.min,next:next?next.min:null};
}

function submitCustomTask(){
  const name=document.getElementById('ctName')?.value.trim();
  const time=document.getElementById('ctTime')?.value||'09:00';
  const dur=parseInt(document.getElementById('ctDur')?.value||'30');
  if(!name){toast(lang==='ru'?'Введи название':'Enter a name');return;}
  const ico=S._taskEmoji||'✅';
  // shift overlapping custom tasks
  const [h,m]=time.split(':').map(Number);
  const startMin=h*60+m;
  S.customTasks.forEach(c=>{
    const [ch,cm]=c.time.split(':').map(Number);
    const cStart=ch*60+cm;
    if(cStart>=startMin&&cStart<startMin+dur){
      const newStart=startMin+dur;
      c.time=String(Math.floor(newStart/60)).padStart(2,'0')+':'+String(newStart%60).padStart(2,'0');
    }
  });
  S.customTasks.push({name,time,dur,ico,done:false});
  sv('custom_tasks_'+tk(),S.customTasks);
  S.showAddForm=false;S._taskEmoji='✅';
  render();
}

// ── ANALYTICS ────────────────────────────────────────────────────────────────
function analyzePatterns(){
  const dayNames={ru:['Вс','Пн','Вт','Ср','Чт','Пт','Сб'],en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']};
  const dayData=[];
  for(let i=0;i<14;i++){
    const d=new Date(Date.now()-i*86400000);
    const key=d.toISOString().slice(0,10);
    const plan=ld('day_plan_'+key,[]);
    const health=ld('health_'+key,{});
    const meals=ld('meals_'+key,[]);
    const pct=plan.length?Math.round(plan.filter(x=>x.done).length/plan.length*100):0;
    dayData.push({date:key,dow:d.getDay(),pct,sleep:health.sleep||0,energy:health.energy||0,kcal:meals.reduce((s,m)=>s+m.kcal,0)});
  }
  const patterns=[];
  const dowScores=Array(7).fill(0),dowCounts=Array(7).fill(0);
  dayData.forEach(d=>{dowScores[d.dow]+=d.pct;dowCounts[d.dow]++;});
  const dowAvg=dowScores.map((s,i)=>dowCounts[i]?Math.round(s/dowCounts[i]):0);
  const nonZero=dowAvg.filter(x=>x>0);
  if(nonZero.length){
    const bestDow=dowAvg.indexOf(Math.max(...dowAvg));
    patterns.push({type:'best_day',ico:'📅',text:{ru:`По ${dayNames.ru[bestDow]} ты продуктивнее всего — ${dowAvg[bestDow]}% выполнения`,en:`${dayNames.en[bestDow]} is your most productive day — ${dowAvg[bestDow]}% completion`}});
  }
  const goodSleep=dayData.filter(d=>d.sleep>=7),badSleep=dayData.filter(d=>d.sleep>0&&d.sleep<7);
  if(goodSleep.length>=3&&badSleep.length>=2){
    const gAvg=Math.round(goodSleep.reduce((s,d)=>s+d.pct,0)/goodSleep.length);
    const bAvg=Math.round(badSleep.reduce((s,d)=>s+d.pct,0)/badSleep.length);
    if(Math.abs(gAvg-bAvg)>10)patterns.push({type:'sleep_prod',ico:'😴',text:{ru:`Когда ты спишь 7+ часов продуктивность выше на ${Math.abs(gAvg-bAvg)}%`,en:`When you sleep 7+ hours productivity is ${Math.abs(gAvg-bAvg)}% higher`}});
  }
  if(S.streak.count>=3)patterns.push({type:'streak',ico:'🔥',text:{ru:`Ты на ${S.streak.count}-дневном стрике! Не останавливайся`,en:`You're on a ${S.streak.count}-day streak! Keep going`}});
  const hiEn=dayData.filter(d=>d.energy>=7);
  if(hiEn.length>=3){const avg=Math.round(hiEn.reduce((s,d)=>s+d.pct,0)/hiEn.length);patterns.push({type:'energy',ico:'⚡',text:{ru:`В дни высокой энергии ты выполняешь ${avg}% плана`,en:`On high energy days you complete ${avg}% of plan`}});}
  sv('patterns',patterns);
  return patterns;
}

function adjustPlanForHealth(){
  const h=S.health;const suggestions=[];
  if(h.energy<=3&&h.energy>0)suggestions.push({type:'warning',text:{ru:'Низкая энергия — перенеси тяжёлые задачи на вечер',en:'Low energy — move heavy tasks to evening'}});

  const notes=S.notes.filter(n=>n.type===S.noteTab);

function setNoteTab(tab){S.noteTab=tab;render();}
function mmEditCenter(v){const mm=ld('mindmap_data',{center:'',nodes:[]});mm.center=v;sv('mindmap_data',mm);}
function mmEditNode(i,v){const mm=ld('mindmap_data',{center:'',nodes:[]});if(mm.nodes[i])mm.nodes[i].text=v;sv('mindmap_data',mm);}
function mmSetColor(i,c){const mm=ld('mindmap_data',{center:'',nodes:[]});if(mm.nodes[i])mm.nodes[i].color=c;sv('mindmap_data',mm);render();}
function mmDelNode(i){const mm=ld('mindmap_data',{center:'',nodes:[]});mm.nodes.splice(i,1);sv('mindmap_data',mm);render();}
function mmAddNode(){const mm=ld('mindmap_data',{center:'',nodes:[]});if(mm.nodes.length<6){const cols=['#6c63ff','#00d4aa','#f5a623','#ff6b6b','#4a9eff'];mm.nodes.push({id:Date.now(),text:lang==='ru'?'Новая ветка':'New branch',color:cols[mm.nodes.length%cols.length]});sv('mindmap_data',mm);render();}}
function saveNote(){
  const text=document.getElementById('noteText')?.value.trim();if(!text)return;
  S.notes.push({type:S.noteTab,text,title:'',date:new Date().toLocaleDateString()});
  sv('notes',S.notes);toast('✓ '+(lang==='ru'?'Сохранено':'Saved'));render();
}
function addJournalItem(field){
  const date=tk(),key='journal_'+field+'_'+date;
  const arr=ld(key,[]);
  document.querySelectorAll(`[data-field="${field}"]`).forEach((ta,i)=>{arr[i]=ta.value;});
  arr.push('');
  sv(key,arr);
  render();
}
function delJournalItem(field,idx){
  const date=tk(),key='journal_'+field+'_'+date;
  const arr=ld(key,[]);
  document.querySelectorAll(`[data-field="${field}"]`).forEach((ta,i)=>{arr[i]=ta.value;});
  arr.splice(idx,1);
  if(arr.length<1)arr.push('');
  sv(key,arr);
  render();
}
function saveAllJournal(){
  const date=tk();
  ['victories','gratitude','lessons','priorities'].forEach(field=>{
    const key='journal_'+field+'_'+date;
    const arr=ld(key,[]);
    document.querySelectorAll(`[data-field="${field}"]`).forEach((ta,i)=>{arr[i]=ta.value;});
    sv(key,arr);
  });
  const victories=ld('journal_victories_'+date,[]).filter(v=>v.trim());
  const today=new Date().toLocaleDateString();
  victories.forEach(v=>{
    if(!S.wins.some(w=>w.text===v.trim()&&w.date===today))S.wins.push({text:v.trim(),date:today});
  });
  sv('wins',S.wins);
  sv('journal_count',ld('journal_count',0)+1);
  addXP(20);
  toast('✓ '+(lang==='ru'?'Сохранено':'Saved'));
}

function exportCSV(){
  const rows=[['Date','Habits Done','Habits Total','Calories','Sleep','Energy','Stress','Focus','Water','Victories']];
  for(let i=29;i>=0;i--){
    const d=new Date(Date.now()-i*86400000);const key=d.toISOString().slice(0,10);
    const plan=ld('day_plan_'+key,[]);const health=ld('health_'+key,{});const meals=ld('meals_'+key,[]);
    const victories=ld('journal_victories_'+key,[]).filter(v=>v.trim());
    rows.push([key,plan.filter(x=>x.done).length,plan.length,meals.reduce((s,m)=>s+m.kcal,0),health.sleep||0,health.energy||0,health.stress||0,health.focus||0,health.water||0,'"'+victories.join(' | ')+'"']);
  }
  const csv=rows.map(r=>r.join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='dailyos_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(url);
  toast(lang==='ru'?'📊 CSV скачан':'📊 CSV downloaded');
}
function getWeekStats(weeksAgo){
  let totalPct=0,totalSleep=0,totalEnergy=0,totalKcal=0,days=0;
  for(let i=0;i<7;i++){
    const key=new Date(Date.now()-(weeksAgo*7+i)*86400000).toISOString().slice(0,10);
    const plan=ld('day_plan_'+key,[]);const health=ld('health_'+key,{});const meals=ld('meals_'+key,[]);
    if(plan.length){totalPct+=Math.round(plan.filter(x=>x.done).length/plan.length*100);totalSleep+=health.sleep||0;totalEnergy+=health.energy||0;totalKcal+=meals.reduce((s,m)=>s+m.kcal,0);days++;}
  }
  if(!days)return null;
  return{pct:Math.round(totalPct/days),sleep:Math.round(totalSleep/days*10)/10,energy:Math.round(totalEnergy/days*10)/10,kcal:Math.round(totalKcal/days),days};
}
function compareArrow(curr,prev,higher=true){
  if(prev==null||prev===0)return '';
  const diff=Math.abs(Math.round((curr-prev)*10)/10);
  const better=higher?curr>prev:curr<prev;
  return better?`<span style="color:var(--teal);font-size:11px;font-weight:700">↑ +${diff}</span>`:`<span style="color:var(--coral);font-size:11px;font-weight:700">↓ -${diff}</span>`;
}

async function generateWeeklyReport(){
  if(!getKey()){toast(lang==='ru'?'Добавь OpenAI ключ':'Add OpenAI key');tab('settings');return;}
  toast(lang==='ru'?'Генерирую отчёт...':'Generating report...');
  const victories=[];
  for(let i=0;i<7;i++){
    const d=new Date(Date.now()-i*86400000).toISOString().slice(0,10);
    (ld('journal_victories_'+d,[])).forEach(v=>{if((v||'').trim())victories.push(d+': '+v);});
  }
  const gratitudes=[];
  for(let i=0;i<7;i++){
    const d=new Date(Date.now()-i*86400000).toISOString().slice(0,10);
    (ld('journal_gratitude_'+d,[])).forEach(v=>{if((v||'').trim())gratitudes.push(v);});
  }
  const lessProg=ld('ai_prog_'+(S.aiSubject||'ai'),0);
  const avgMood=S.health.mood||0;
  try{
    const res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getKey()},body:JSON.stringify({model:'gpt-4o-mini',max_tokens:600,messages:[
      {role:'system',content:`You are a personal productivity coach. Generate a concise weekly report for the user. Respond in ${lang==='ru'?'Russian':'English'}. Be specific, motivating, and actionable.`},
      {role:'user',content:`User: ${S.user.name||'User'}. Goal: ${S.user.goal||'personal growth'}. This week's victories: ${victories.join('; ')||'none logged'}. Gratitude notes: ${gratitudes.slice(0,5).join('; ')||'none'}. AI lessons completed: ${lessProg}. Current mood: ${avgMood}/10. Write a structured weekly report with: key wins, patterns noticed, and 3 specific actions for next week.`}
    ]})});
    const data=await res.json();
    const report=data.choices?.[0]?.message?.content||'';
    if(report){sv('weekly_report_'+tk(),report);toast('✅ '+(lang==='ru'?'Отчёт готов!':'Report ready!'));render();}
  }catch(e){toast(lang==='ru'?'Ошибка генерации':'Generation error');}
}

      <div style="margin-bottom:12px"><div style="font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px">${lang==='ru'?'Текущий вес (кг)':'Current weight (kg)'}</div><input class="ob-inp" id="obW" type="number" placeholder="89" value="89"/></div>
      <div style="margin-bottom:12px"><div style="font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px">${lang==='ru'?'Целевой вес (кг)':'Target weight (kg)'}</div><input class="ob-inp" id="obT" type="number" placeholder="80" value="80"/></div>
      <div style="margin-bottom:12px"><div style="font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px">${lang==='ru'?'Рост (см)':'Height (cm)'}</div><input class="ob-inp" id="obH" type="number" placeholder="178" value="178"/></div>
      <div class="ob-grid">
        <div class="ob-opt on" onclick="obSel(this,'low')"><span class="ob-opt-ico">🚶</span>${lang==='ru'?'Мало двигаюсь':'Low activity'}</div>
        <div class="ob-opt" onclick="obSel(this,'medium')"><span class="ob-opt-ico">🏃</span>${lang==='ru'?'Умеренно':'Moderate'}</div>
        <div class="ob-opt" onclick="obSel(this,'high')"><span class="ob-opt-ico">🔥</span>${lang==='ru'?'Активно':'Active'}</div>
      </div>
      <button class="ob-btn" onclick="obNext()">${lang==='ru'?'Продолжить →':'Continue →'}</button>`,
    save:()=>{
      S.user.weight=parseFloat(document.getElementById('obW')?.value)||89;
      S.user.targetWeight=parseFloat(document.getElementById('obT')?.value)||80;
      S.user.height=parseFloat(document.getElementById('obH')?.value)||178;
      const s=document.querySelector('#ob .ob-opt.on');if(s)S.user.activityLevel=s.textContent.trim().toLowerCase().includes('мало')||s.textContent.trim().toLowerCase().includes('low')?'low':s.textContent.trim().toLowerCase().includes('акти')||s.textContent.trim().toLowerCase().includes('activ')?'high':'medium';
    }
  },
  {
    title:{ru:'Есть ли ограничения в питании?',en:'Any dietary restrictions?'},
    render:()=>`<div class="ob-multi">${[
      {id:'gluten_free',lbl:{ru:'Без глютена 🌾',en:'Gluten-free 🌾'}},
      {id:'lactose_free',lbl:{ru:'Без лактозы 🥛',en:'Lactose-free 🥛'}},
      {id:'vegetarian',lbl:{ru:'Вегетарианство 🥗',en:'Vegetarian 🥗'}},
      {id:'vegan',lbl:{ru:'Веганство 🌱',en:'Vegan 🌱'}},
      {id:'no_nuts',lbl:{ru:'Без орехов 🥜',en:'No nuts 🥜'}},
      {id:'no_seafood',lbl:{ru:'Без морепродуктов 🦞',en:'No seafood 🦞'}},
      {id:'halal',lbl:{ru:'Халяль ☪️',en:'Halal ☪️'}},
      {id:'none',lbl:{ru:'Без ограничений ✓',en:'No restrictions ✓'}},
    ].map(tag=>`<div class="ob-tag ${S.user.allergies.includes(tag.id)?'on':''}" onclick="obToggleAllergy('${tag.id}',this)">${tag.lbl[lang]}</div>`).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="ob-btn" style="flex:1" onclick="obNext()">${lang==='ru'?'Продолжить →':'Continue →'}</button>
      <button onclick="obSkipAllergies()" style="background:var(--glass);border:1px solid var(--border2);border-radius:var(--r);padding:15px 20px;color:var(--text2);font-size:13px;font-weight:600;font-family:var(--font-h);cursor:pointer">${lang==='ru'?'Пропустить':'Skip'}</button>
    </div>`,
    save:()=>{}
  },
  {
    title:{ru:'Выбери привычки для старта',en:'Choose habits to start'},
    render:()=>`<div class="ob-multi">${HABIT_LIB.slice(0,16).map(h=>`<div class="ob-tag ${S.myHabits.includes(h.id)?'on':''}" onclick="obToggleHabit('${h.id}',this)">${h.ico} ${h.name[lang]||h.name.ru}</div>`).join('')}</div><button class="ob-btn" onclick="obFinish()">${lang==='ru'?'Начать! 🚀':'Start! 🚀'}</button>`,
    save:()=>{}
  },
];

function obNext(){OB[obStep].save();obStep++;if(obStep>=OB.length){obFinish();return;}renderOB();}
function obSel(el){document.querySelectorAll('#ob .ob-opt').forEach(o=>o.classList.remove('on'));el.classList.add('on');}
function obToggleHabit(id,el){
  el.classList.toggle('on');
  const idx=S.myHabits.indexOf(id);
  if(idx>=0)S.myHabits.splice(idx,1);else S.myHabits.push(id);
}
function obFinish(){
  OB[obStep]?.save();
  S.dayPlan=S.myHabits.map(id=>{const h=HABIT_LIB.find(x=>x.id===id);return h?{id:h.id,done:false}:null;}).filter(Boolean);
  S.dayPlan.sort((a,b)=>{const ha=HABIT_LIB.find(x=>x.id===a.id),hb=HABIT_LIB.find(x=>x.id===b.id);return ha&&hb?ha.time.localeCompare(hb.time):0;});
  sv('user',S.user);sv('my_habits',S.myHabits);sv('day_plan_'+tk(),S.dayPlan);sv('ob_done',true);
  document.getElementById('ob').style.display='none';buildNav();render();
}
function obToggleAllergy(id,el){
  if(id==='none'){
    S.user.allergies=[];
    document.querySelectorAll('#ob .ob-tag').forEach(t=>t.classList.remove('on'));
    el.classList.add('on');
    return;
  }
  const noneIdx=S.user.allergies.indexOf('none');
  if(noneIdx>=0){
    S.user.allergies.splice(noneIdx,1);
    document.querySelectorAll('#ob .ob-tag').forEach(t=>{if(t.textContent.includes('✓'))t.classList.remove('on');});
  }
  el.classList.toggle('on');
  const idx=S.user.allergies.indexOf(id);
  if(idx>=0)S.user.allergies.splice(idx,1);else S.user.allergies.push(id);
}
function obSkipAllergies(){S.user.allergies=[];obNext();}

function renderOB(){
  const s=OB[obStep];
  document.getElementById('ob-card').innerHTML=`<div class="ob-step-label">Step ${obStep+1}/${OB.length}</div><div class="ob-step-title">${s.title[lang]||s.title.ru}</div>${s.render()}`;
  document.querySelectorAll('.ob-dot').forEach((d,i)=>d.classList.toggle('on',i===obStep));
}

// ── INIT ──────────────────────────────────────────────────────────────────────
const DAYS_RU=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'],DAYS_EN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS_RU=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const MONTHS_EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const now=new Date();
const dayNames=lang==='ru'?DAYS_RU:DAYS_EN;
const monthNames=lang==='ru'?MONTHS_RU:MONTHS_EN;
document.getElementById('hdrDate').textContent=dayNames[now.getDay()]+', '+now.getDate()+' '+monthNames[now.getMonth()];

try{window.Telegram?.WebApp?.ready();window.Telegram?.WebApp?.expand();}catch(e){}
updStreak();

const obDone=ld('ob_done',false);
const hasName=(S.user.name||'').trim().length>0;
if(!obDone&&!hasName){
  document.getElementById('ob').style.display='flex';
  renderOB();
} else {
  sv('ob_done',true);
  const _hashMap={'#habits':'habits','#nutrition':'nutrition','#focus':'ai','#stats':'stats','#settings':'settings','#health':'health','#breath':'breath','#journal':'journal','#chat':'chat'};
  const _initHash=window.location.hash;
  if(_hashMap[_initHash])S.tab=_hashMap[_initHash];
  buildNav();render();
}
</script>
</body>
</html>
